name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04

    # the release legs also build the benchmarks so API changes can't rot them; they are
    # never run here, timings on a shared runner are noise
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang-debug, cc: clang-22, type: Debug, shared: "ON", flags: "" }
          - { name: clang-release, cc: clang-22, type: Release, shared: "ON", flags: "", bench: "ON" }
          - { name: clang-debug-san, cc: clang-22, type: Debug, shared: "ON", flags: "-fsanitize=address,undefined,implicit-conversion,local-bounds -fno-sanitize-recover=all" }
          - { name: gcc-debug, cc: gcc-15, type: Debug, shared: "ON", flags: "" }
          - { name: gcc-release-static, cc: gcc-15, type: Release, shared: "OFF", flags: "", bench: "ON" }
          - { name: clang-release-static, cc: clang-22, type: Release, shared: "OFF", flags: "" }
          - { name: clang-release-hardened, cc: clang-22, type: Release, shared: "ON", flags: "", hardened: "ON" }

    steps:
      - uses: actions/checkout@v7

      - run: >-
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DTDA_BUILD_SHARED=${{ matrix.shared }}
          -DTDA_HARDENED=${{ matrix.hardened || 'OFF' }}
          -DTDA_BUILD_BENCH=${{ matrix.bench || 'OFF' }}
          -DCMAKE_C_FLAGS="-Werror ${{ matrix.flags }}"

      - run: cmake --build build -j

      - run: ctest --test-dir build --output-on-failure

  consumer:
    name: consumer
    runs-on: ubuntu-26.04

    # tda is consumed as a source dependency and nothing else, so the one path that has
    # to keep working is add_subdirectory — the same one FetchContent takes once it has
    # fetched. The build above it is always top-level, so only this leg sees the defaults
    # that hold for a subproject.
    steps:
      - uses: actions/checkout@v7

      - run: cmake -S test/consumer -B build-consumer

      - run: cmake --build build-consumer -j

      - run: ./build-consumer/consumer_app

  docs:
    name: docs
    runs-on: ubuntu-26.04

    # the reference is published only on a release, so this is where a broken @param or
    # a stale link shows up first: any doxygen warning fails the leg
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y doxygen

      - run: (cat docs/Doxyfile; echo "WARN_AS_ERROR = FAIL_ON_WARNINGS") | doxygen -
