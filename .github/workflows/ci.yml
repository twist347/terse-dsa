name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os || 'ubuntu-26.04' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang-debug, cc: clang-22, type: Debug, shared: "ON", flags: "" }
          - { name: linux-clang-release, cc: clang-22, type: Release, shared: "ON", flags: "" }
          - { name: linux-clang-debug-san, cc: clang-22, type: Debug, shared: "ON", flags: "-fsanitize=address,undefined,implicit-conversion,local-bounds -fno-sanitize-recover=all" }
          - { name: linux-gcc-debug, cc: gcc-15, type: Debug, shared: "ON", flags: "" }
          - { name: linux-gcc-release-static, cc: gcc-15, type: Release, shared: "OFF", flags: "" }
          - { name: linux-clang-release-hardened, cc: clang-22, type: Release, shared: "ON", flags: "", hardened: "ON" }
          # Apple clang; the libc there has no <stdbit.h>, so this is the leg that builds
          # internal/bits.h through the builtins
          - { name: macos-clang-debug, os: macos-latest, cc: clang, type: Debug, shared: "ON", flags: "" }
          - { name: macos-clang-release, os: macos-latest, cc: clang, type: Release, shared: "ON", flags: "" }

    steps:
      - uses: actions/checkout@v7

      - run: >-
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DTDA_BUILD_SHARED=${{ matrix.shared }}
          -DTDA_HARDENED=${{ matrix.hardened || 'OFF' }}
          -DCMAKE_C_FLAGS="-Werror ${{ matrix.flags }}"

      - run: cmake --build build -j

      - run: ctest --test-dir build --output-on-failure

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest

    # clang from MSYS2 rather than the LLVM the image ships, whose version is not pinned;
    # the C library is still the UCRT, and the shared build is what tests dllexport
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-clang-debug, type: Debug }
          - { name: windows-clang-release, type: Release }

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCMAKE_C_FLAGS="-Werror"

      - run: cmake --build build

      - run: ctest --test-dir build --output-on-failure

  consumer:
    name: consumer
    runs-on: ubuntu-26.04

    # tda is consumed as a source dependency and nothing else, so the one path that has
    # to keep working is add_subdirectory — the same one FetchContent takes once it has
    # fetched. The build above it is always top-level, so only this leg sees the defaults
    # that hold for a subproject.
    steps:
      - uses: actions/checkout@v7

      - run: cmake -S test/consumer -B build-consumer

      - run: cmake --build build-consumer -j

      - run: ./build-consumer/consumer_app
